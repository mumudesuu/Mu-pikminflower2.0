<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 沐光花語 花田觀測</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>

:root{
  --cream:#FFF6E8;
  --cream-deep:#FBE9CC;
  --leaf:#3E9166;
  --leaf-deep:#276148;
  --ink:#2B4636;
  --pink:#FF7FA8;
  --pink-deep:#E85D8D;
  --yellow:#FFC93C;
  --sky:#5FC1DE;
  --purple:#B080E0;
  --white:#FFFFFF;
  --red:#D8464E;

  --card-shadow:
    0 6px 0 rgba(39,97,72,0.14);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;

  font-family:
    "Zen Maru Gothic",
    "Noto Sans TC",
    sans-serif;

  background:
    radial-gradient(
      circle at 10% 15%,
      rgba(255,201,60,0.18),
      transparent 40%
    ),
    radial-gradient(
      circle at 90% 10%,
      rgba(255,127,168,0.16),
      transparent 45%
    ),
    radial-gradient(
      circle at 50% 90%,
      rgba(95,193,222,0.15),
      transparent 40%
    ),
    var(--cream);

  color:var(--ink);

  min-height:100vh;

  overflow-x:hidden;
}

.drift{
  position:fixed;
  pointer-events:none;
  z-index:0;
  opacity:0.55;

  animation:
    drift
    9s
    ease-in-out
    infinite;

  font-size:
    clamp(22px,3vw,34px);
}

.drift.d1{
  top:10%;
  left:4%;
  animation-delay:0s;
}

.drift.d2{
  top:65%;
  left:2%;
  animation-delay:1.5s;
}

.drift.d3{
  top:20%;
  right:5%;
  animation-delay:0.7s;
}

.drift.d4{
  top:75%;
  right:6%;
  animation-delay:2.2s;
}

.drift.d5{
  top:40%;
  left:1%;
  animation-delay:3s;
  font-size:20px;
}

@keyframes drift{

  0%,100%{
    transform:
      translateY(0)
      rotate(-4deg);
  }

  50%{
    transform:
      translateY(-22px)
      rotate(6deg);
  }

}

@media (prefers-reduced-motion: reduce){

  *{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }

}

.wrap{
  position:relative;
  z-index:1;

  max-width:1080px;

  margin:0 auto;

  padding:
    28px
    20px
    80px;
}

.bloom-strip{
  display:flex;

  justify-content:center;

  gap:10px;

  margin-bottom:6px;

  flex-wrap:wrap;
}

.bloom-strip span{
  display:inline-block;

  font-size:
    clamp(18px,2.4vw,26px);

  transform:scale(0);

  animation:
    bloom-pop
    0.6s
    cubic-bezier(.34,1.56,.64,1)
    forwards;
}

.bloom-strip span:nth-child(1){
  animation-delay:.05s;
}

.bloom-strip span:nth-child(2){
  animation-delay:.15s;
}

.bloom-strip span:nth-child(3){
  animation-delay:.25s;
}

.bloom-strip span:nth-child(4){
  animation-delay:.35s;
}

.bloom-strip span:nth-child(5){
  animation-delay:.45s;
}

.bloom-strip span:nth-child(6){
  animation-delay:.55s;
}

.bloom-strip span:nth-child(7){
  animation-delay:.65s;
}

.bloom-strip span:nth-child(8){
  animation-delay:.75s;
}

.bloom-strip span:nth-child(9){
  animation-delay:.85s;
}

@keyframes bloom-pop{

  0%{
    transform:
      scale(0)
      rotate(-30deg);

    opacity:0;
  }

  70%{
    transform:
      scale(1.25)
      rotate(8deg);

    opacity:1;
  }

  100%{
    transform:
      scale(1)
      rotate(0);

    opacity:1;
  }

}

header{
  text-align:center;
  margin-bottom:28px;
}

.mascot{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  width:64px;
  height:64px;

  margin-bottom:6px;

  font-size:50px;

  animation:
    bob
    2.4s
    ease-in-out
    infinite;
}

@keyframes bob{

  0%,100%{
    transform:
      translateY(0)
      rotate(-3deg);
  }

  50%{
    transform:
      translateY(-8px)
      rotate(3deg);
  }

}

h1{
  font-family:
    "Baloo 2",
    "Zen Maru Gothic",
    sans-serif;

  font-weight:800;

  font-size:
    clamp(28px,5vw,44px);

  margin:
    4px
    0
    8px;

  color:var(--leaf-deep);

  letter-spacing:1px;

  text-shadow:
    3px 3px 0 var(--white);
}

header p.sub{
  font-size:
    clamp(13px,1.8vw,16px);

  color:#5C7B6A;

  margin:0;

  font-weight:500;
}

.update-pill{
  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-top:14px;

  background:var(--white);

  border:
    2px dashed
    var(--leaf);

  color:var(--leaf-deep);

  padding:
    6px
    16px;

  border-radius:999px;

  font-size:13px;

  font-weight:700;
}

.update-pill button{
  border:none;

  background:var(--leaf);

  color:#fff;

  font-family:inherit;

  font-weight:700;

  font-size:12px;

  padding:
    4px
    12px;

  border-radius:999px;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.update-pill button:hover{
  background:var(--leaf-deep);

  transform:
    translateY(-1px);
}

.update-pill button:active{
  transform:
    translateY(1px)
    scale(.96);
}

.sync-pill{
  display:inline-flex;

  align-items:center;

  gap:7px;

  margin-top:9px;

  background:#EFF7F1;

  border:
    2px dashed
    #A8D2B5;

  color:var(--leaf-deep);

  padding:
    6px
    15px;

  border-radius:999px;

  font-size:12px;

  font-weight:700;
}

.sync-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:#64B77D;

  box-shadow:
    0 0 0 4px
    rgba(100,183,125,.14);
}

.sync-pill.offline{
  background:#FFF1E4;

  border-color:#F2C28E;

  color:#B76D2C;
}

.sync-pill.offline .sync-dot{
  background:#E58A45;

  box-shadow:
    0 0 0 4px
    rgba(229,138,69,.13);
}

.admin-pill{
  display:inline-flex;

  align-items:center;

  gap:8px;

  margin-top:10px;

  background:var(--white);

  border:
    2px dashed
    var(--purple);

  color:#6B4A9A;

  padding:
    6px
    16px;

  border-radius:999px;

  font-size:13px;

  font-weight:700;
}

.admin-pill.is-admin{
  border-color:var(--leaf);

  color:var(--leaf-deep);

  background:#EAF6EE;
}

.admin-pill button{
  border:none;

  font-family:inherit;

  font-weight:700;

  font-size:12px;

  padding:
    4px
    12px;

  border-radius:999px;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;

  background:var(--purple);

  color:#fff;
}

.admin-pill.is-admin button{
  background:#D8464E;
}

.admin-pill button:hover{
  transform:
    translateY(-1px);

  filter:brightness(1.05);
}

.admin-pill button:active{
  transform:
    translateY(1px)
    scale(.96);
}

.modal-overlay{
  position:fixed;

  inset:0;

  background:
    rgba(43,70,54,0.45);

  display:flex;

  align-items:center;

  justify-content:center;

  z-index:50;

  padding:20px;
}

.modal-box{
  background:var(--white);

  border-radius:22px;

  padding:
    26px
    24px;

  max-width:360px;

  width:100%;

  text-align:center;

  box-shadow:
    0 10px 0
    rgba(39,97,72,0.18);
}

.modal-box h3{
  font-family:
    "Baloo 2",
    sans-serif;

  color:var(--leaf-deep);

  margin:
    0
    0
    6px;

  font-size:20px;
}

.modal-box p{
  font-size:13px;

  color:#7C9686;

  margin:
    0
    0
    16px;

  line-height:1.7;
}

.modal-box input{
  width:100%;

  font-family:
    "Zen Maru Gothic",
    sans-serif;

  font-size:15px;

  padding:
    11px
    13px;

  border-radius:12px;

  border:
    2px solid
    #D9E8DD;

  margin-bottom:10px;

  outline:none;

  transition:
    border-color .15s ease;
}

.modal-box input:focus{
  border-color:var(--leaf);
}

.modal-error{
  font-size:12px;

  color:#D8464E;

  font-weight:700;

  min-height:18px;

  margin-bottom:8px;
}

.modal-actions{
  display:flex;

  gap:10px;
}

.modal-actions button{
  flex:1;

  border:none;

  font-family:inherit;

  font-weight:700;

  font-size:14px;

  padding:10px 0;

  border-radius:12px;

  cursor:pointer;

  transition:
    transform .15s ease;
}

.modal-actions .confirm{
  background:var(--leaf);

  color:#fff;
}

.modal-actions .cancel{
  background:#EFEAE0;

  color:#6B7C71;
}

.modal-actions button:active{
  transform:scale(.96);
}

.filter-bar{
  display:flex;

  flex-wrap:wrap;

  gap:10px;

  justify-content:center;

  margin:
    26px
    0
    30px;
}

.chip{
  border:none;

  cursor:pointer;

  font-family:
    "Zen Maru Gothic",
    sans-serif;

  font-weight:700;

  font-size:14px;

  padding:
    9px
    18px;

  border-radius:999px;

  background:var(--white);

  color:var(--ink);

  box-shadow:
    0 3px 0
    rgba(43,70,54,0.15);

  display:inline-flex;

  align-items:center;

  gap:6px;

  transition:
    transform .15s ease,
    box-shadow .15s ease,
    background .15s ease,
    color .15s ease;
}

.chip:hover{
  transform:
    translateY(-2px);
}

.chip.active{
  background:var(--leaf);

  color:#fff;

  box-shadow:
    0 3px 0
    var(--leaf-deep);
}

.chip .dot{
  width:10px;
  height:10px;

  border-radius:50%;

  display:inline-block;
}

.grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(280px,1fr)
    );

  gap:20px;
}

.card{
  background:var(--white);

  border-radius:22px;

  padding:
    20px
    20px
    18px;

  box-shadow:var(--card-shadow);

  border:
    3px solid
    rgba(39,97,72,0.06);

  position:relative;

  transition:
    transform .2s ease,
    box-shadow .2s ease;

  opacity:0;

  transform:
    translateY(14px)
    scale(.97);

  animation:
    card-in
    .5s
    ease
    forwards;
}

.card:hover{
  transform:
    translateY(-4px);

  box-shadow:
    0 10px 0
    rgba(39,97,72,0.14);
}

@keyframes card-in{

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}

.card.harvest-glow{
  border:
    3px solid
    var(--yellow);

  animation:
    card-in .5s ease forwards,
    harvest-pulse 1.6s ease-in-out infinite;
}

@keyframes harvest-pulse{

  0%,100%{
    box-shadow:
      0 0 0 5px
      rgba(255,201,60,0.28),
      0 8px 0
      rgba(39,97,72,0.14);
  }

  50%{
    box-shadow:
      0 0 0 9px
      rgba(255,201,60,0.14),
      0 8px 0
      rgba(39,97,72,0.14);
  }

}

.card-top{
  display:flex;

  justify-content:space-between;

  align-items:flex-start;

  gap:8px;

  margin-bottom:10px;
}

.card-loc{
  font-family:
    "Baloo 2",
    sans-serif;

  font-weight:700;

  font-size:18px;

  color:var(--leaf-deep);

  display:flex;

  align-items:center;

  gap:6px;
}

.color-badge{
  flex-shrink:0;

  font-size:12px;

  font-weight:700;

  padding:
    5px
    11px;

  border-radius:999px;

  color:#fff;

  white-space:nowrap;
}

.status-row{
  display:flex;

  align-items:center;

  gap:8px;

  font-size:13px;

  font-weight:700;

  margin-bottom:10px;

  padding:
    8px
    12px;

  border-radius:14px;

  background:#EFF7F1;

  color:var(--leaf-deep);

  transition:
    background .25s ease,
    color .25s ease;
}

.status-row.harvest{
  background:#FFF6DC;

  color:#B9820A;
}

.status-row.cooling{
  background:#FFF1E4;

  color:#C97327;
}

.status-row.loading{
  background:#F3F0EA;

  color:#8A806E;
}

.status-dot{
  width:8px;
  height:8px;

  border-radius:50%;

  background:currentColor;

  flex-shrink:0;
}

.countdown-time{
  font-family:
    "Baloo 2",
    monospace;

  font-size:16px;

  letter-spacing:.5px;

  margin-left:auto;
}

.coord-box{
  display:flex;

  align-items:center;

  justify-content:space-between;

  background:var(--cream-deep);

  border:
    2px dashed
    #E3C48F;

  border-radius:14px;

  padding:
    8px
    10px
    8px
    14px;

  gap:8px;

  margin-bottom:10px;
}

.coord-box code{
  font-family:
    "Baloo 2",
    monospace;

  font-size:13px;

  color:#7A5A2C;

  font-weight:600;

  word-break:break-all;
}

.copy-btn{
  flex-shrink:0;

  border:none;

  background:var(--yellow);

  color:#6B4A00;

  font-weight:800;

  font-size:12px;

  padding:
    7px
    12px;

  border-radius:10px;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.copy-btn:hover{
  background:#FFD966;

  transform:
    translateY(-1px);
}

.copy-btn:active{
  transform:
    translateY(1px)
    scale(.95);
}

.copy-btn.copied{
  background:var(--leaf);

  color:#fff;
}

.note{
  font-size:12.5px;

  color:#8A7A5E;

  background:#FFF9EE;

  border-left:
    3px solid
    var(--yellow);

  padding:
    6px
    10px;

  border-radius:
    0
    10px
    10px
    0;

  line-height:1.6;
}

.note div + div{
  margin-top:2px;
}

.cooldown-btns{
  display:flex;

  flex-wrap:wrap;

  gap:6px;

  margin-top:12px;

  margin-bottom:4px;
}

.cd-btn{
  border:none;

  cursor:pointer;

  font-family:
    "Zen Maru Gothic",
    sans-serif;

  font-weight:700;

  font-size:12px;

  padding:
    6px
    12px;

  border-radius:10px;

  background:#EAF3EC;

  color:var(--leaf-deep);

  transition:
    transform .15s ease,
    background .15s ease;
}

.cd-btn:hover{
  background:#DCEEE1;

  transform:
    translateY(-1px);
}

.cd-btn:active{
  transform:
    translateY(1px)
    scale(.95);
}

.cd-btn.reset{
  background:#FDEAEA;

  color:#C1454D;
}

.cd-btn.reset:hover{
  background:#FBDCDC;
}

.locked-hint{
  font-size:12px;

  color:#A6947A;

  background:#FBF3E4;

  border-radius:10px;

  padding:
    8px
    12px;

  text-align:center;

  margin-top:12px;
}

.empty{
  text-align:center;

  grid-column:1/-1;

  padding:
    50px
    20px;

  color:#7C9686;

  font-weight:600;
}

.empty .emoji{
  font-size:40px;

  display:block;

  margin-bottom:10px;
}

.sign{
  margin-top:56px;

  background:
    linear-gradient(
      180deg,
      #C99A5B,
      #B7864A
    );

  border-radius:18px;

  padding:
    24px
    26px;

  color:#FFF3DD;

  box-shadow:
    0 8px 0
    #8E6437;

  position:relative;
}

.sign::before{
  content:"";

  position:absolute;

  top:-14px;

  left:50%;

  transform:
    translateX(-50%);

  width:50px;

  height:14px;

  background:#8E6437;

  border-radius:
    6px
    6px
    0
    0;
}

.sign h2{
  font-family:
    "Baloo 2",
    sans-serif;

  margin:
    0
    0
    12px;

  font-size:20px;

  display:flex;

  align-items:center;

  gap:8px;
}

.sign ul{
  margin:0;

  padding-left:2px;

  list-style:none;

  display:flex;

  flex-direction:column;

  gap:8px;

  font-size:14px;

  line-height:1.6;
}

.sign li{
  display:flex;

  gap:8px;
}

.sign li b{
  flex-shrink:0;
}

footer.credit{
  text-align:center;

  margin-top:30px;

  font-size:12px;

  color:#9AA88E;

  line-height:1.7;
}

.firebase-error{
  display:none;

  max-width:700px;

  margin:
    15px
    auto
    0;

  padding:
    10px
    14px;

  border-radius:12px;

  background:#FDEAEA;

  color:#B83D46;

  border:
    2px solid
    #F3C1C5;

  font-size:12px;

  line-height:1.6;

  text-align:center;
}

.firebase-error.show{
  display:block;
}

@media(max-width:520px){

  .filter-bar{
    gap:8px;
  }

  .chip{
    padding:
      7px
      14px;

    font-size:13px;
  }

  .coord-box{
    align-items:flex-start;
  }

  .coord-box code{
    font-size:12px;
  }

  .copy-btn{
    padding:
      7px
      9px;
  }

}

</style>
</head>

<body>

<span class="drift d1">🍃</span>
<span class="drift d2">🌱</span>
<span class="drift d3">🍃</span>
<span class="drift d4">🌱</span>
<span class="drift d5">🍃</span>

<div class="wrap">

  <div class="bloom-strip" aria-hidden="true">
    <span>🌸</span>
    <span>🌼</span>
    <span>🌷</span>
    <span>🌺</span>
    <span>🌻</span>
    <span>🌹</span>
    <span>💮</span>
    <span>🪻</span>
    <span>🌸</span>
  </div>

  <header>

    <div class="mascot">
      🌱
    </div>

    <h1>
      沐光花語 花田觀測
    </h1>

    <p class="sub">
      沐沐種田中，未經同意請勿轉發，謝謝 🌱
    </p>

    <div class="update-pill">

      <span id="updateTime">
        連線中…
      </span>

      <button
        id="refreshBtn"
        type="button"
      >
        🔄 重新整理
      </button>

    </div>

    <div
      class="sync-pill"
      id="syncPill"
    >

      <span class="sync-dot"></span>

      <span id="syncStatus">
        ☁️ 正在連接花田資料庫…
      </span>

    </div>

    <div
      class="admin-pill"
      id="adminPill"
    >

      <span id="adminStatusText">
        🔒 訪客模式
      </span>

      <button
        id="adminBtn"
        type="button"
      >
        管理員登入
      </button>

    </div>

    <div
      class="firebase-error"
      id="firebaseError"
    ></div>

  </header>


  <div id="modalRoot"></div>


  <nav
    class="filter-bar"
    id="filterBar"
    aria-label="依地區篩選"
  ></nav>


  <main
    class="grid"
    id="grid"
  ></main>


  <section class="sign">

    <h2>
      🧺 收成小提醒
    </h2>

    <ul>

      <li>
        <b>✗</b>
        <span>
          未經同意請勿轉傳座標，也不要偷田
        </span>
      </li>

      <li>
        <b>✗</b>
        <span>
          還是花苗或花苞的田請勿踩踏
        </span>

/* =========================================================

   ========================================================= */

function formatRemain(ms){

  const totalSec =
    Math.max(
      0,
      Math.floor(
        ms / 1000
      )
    );

  const h =
    Math.floor(
      totalSec / 3600
    );

  const m =
    Math.floor(
      (totalSec % 3600) / 60
    );

  const s =
    totalSec % 60;

  const pad =
    n =>
      String(n).padStart(
        2,
        "0"
      );


  if(h > 0){

    return `${h}:${pad(m)}:${pad(s)}`;

  }


  return `${pad(m)}:${pad(s)}`;

}


/* =========================================================
   將 Firestore 資料轉成安全的時間數字
   ========================================================= */

function normalizeTime(value){

  /*
   * 正常情況：
   * 我們自己寫入的是 number
   */

  if(
    typeof value === "number" &&
    Number.isFinite(value)
  ){

    return value;

  }


  /*
   * 如果未來 Firestore 裡面變成 Timestamp，
   * 也可以正常處理。
   */

  if(
    value &&
    typeof value.toMillis === "function"
  ){

    return value.toMillis();

  }


  return null;

}


/* =========================================================
   取得一個花田目前真正使用的倒數
   ========================================================= */

function getEffectiveCooldown(
  flower
){

  /*
   * 如果本機剛剛有按按鈕，
   * 優先使用本機已確認的狀態。
   */

  const pending =
    pendingCooldowns.get(
      flower.id
    );


  if(pending){

    /*
     * 如果本機狀態也已經結束，
     * 清掉它。
     */

    if(
      Date.now() >=
      pending.cooldownUntil
    ){

      pendingCooldowns.delete(
        flower.id
      );

    }else{

      return pending;

    }

  }


  /*
   * 正常使用 Firestore 狀態。
   */

  if(
    typeof flower.cooldownStart === "number" &&
    typeof flower.cooldownUntil === "number"
  ){

    return {

      cooldownStart:
        flower.cooldownStart,

      cooldownUntil:
        flower.cooldownUntil

    };

  }


  /*
   * 如果 Firestore 只有 until，
   * 不直接當成「空閒」。
   *
   * 這可以避免舊資料或同步延遲
   * 導致畫面瞬間跳回空閒。
   */

  if(
    typeof flower.cooldownUntil === "number"
  ){

    return {

      cooldownStart:
        flower.cooldownUntil -
        23 * 60 * 60 * 1000,

      cooldownUntil:
        flower.cooldownUntil

    };

  }


  return null;

}

/* =========================================================
   Firestore 即時監聽
   ========================================================= */

function listenToFlowers(){

  setSyncStatus(
    "☁️ 正在同步花田資料…"
  );


  const flowersRef =
    collection(
      db,
      "flowers"
    );


  unsubscribeFlowers =
    onSnapshot(

      flowersRef,

      snapshot => {

        hideFirebaseError();

        setSyncStatus(
          "☁️ 花田資料已同步"
        );


        /*
         * Firestore 更新花田資料
         */

        snapshot.forEach(
          docSnapshot => {

            const data =
              docSnapshot.data();

            const flower =
              flowers.find(
                f =>
                  f.id ===
                  docSnapshot.id
              );


            if(!flower){

              return;

            }


            const firestoreStart =
              normalizeTime(
                data.cooldownStart
              );

            const firestoreUntil =
              normalizeTime(
                data.cooldownUntil
              );


            /*
             * 更新 Firestore 狀態
             */

            flower.cooldownStart =
              firestoreStart;

            flower.cooldownUntil =
              firestoreUntil;


            /*
             * 如果 Firestore 已經成功回傳
             * 和我們剛剛寫入的一樣，
             * 就解除 pending。
             */

            const pending =
              pendingCooldowns.get(
                flower.id
              );


            if(
              pending &&
              firestoreStart ===
                pending.cooldownStart &&
              firestoreUntil ===
                pending.cooldownUntil
            ){

              pendingCooldowns.delete(
                flower.id
              );

            }

          }
        );


        /*
         * Firestore 裡完全不存在的花田
         */

        flowers.forEach(
          flower => {

            const found =
              snapshot.docs.some(
                d =>
                  d.id ===
                  flower.id
              );


            if(!found){

              /*
               * 如果沒有 pending，
               * 才真正視為沒有倒數。
               */

              if(
                !pendingCooldowns.has(
                  flower.id
                )
              ){

                flower.cooldownStart =
                  null;

                flower.cooldownUntil =
                  null;

              }

            }

          }
        );


        updateRefreshTime();

        renderCards();

      },

      error => {

        console.error(
          "Firestore 同步錯誤:",
          error
        );


        setSyncStatus(
          "⚠️ 無法同步花田資料",
          true
        );


        showFirebaseError(
          "目前無法讀取 Firestore 花田資料。請確認 Firestore Rules 是否已設定。"
        );


        renderCards();

      }

    );

}


/* =========================================================
   開始倒數
   ========================================================= */

async function startCooldown(
  id,
  minutes
){

  if(!isAdmin){

    showFirebaseError(
      "請先登入管理員帳號 🌱"
    );

    return;

  }


  const flower =
    flowers.find(
      x =>
        x.id === id
    );


  if(!flower){

    return;

  }


  /*
   * ★ 這裡是這次修正的核心
   *
   * 一按按鈕就固定取得同一個開始時間。
   *
   * 例如：
   *
   * 10:00 按 23hr
   *
   * cooldownStart = 10:00
   * cooldownUntil = 隔天 09:00
   */

  const start =
    Date.now();

  const until =
    start +
    minutes *
    60 *
    1000;


  /*
   * ★ 先立即更新本機狀態
   *
   * 所以按下按鈕後不需要等待 Firestore。
   */

  flower.cooldownStart =
    start;

  flower.cooldownUntil =
    until;


  pendingCooldowns.set(
    id,
    {

      cooldownStart:
        start,

      cooldownUntil:
        until

    }
  );


  /*
   * 立即更新畫面
   */

  renderCards();

  updateAllCountdowns();


  try{

    setSyncStatus(
      "☁️ 正在同步新的倒數…"
    );


    /*
     * ★ 寫入 Firestore
     *
     * 所有裝置之後都會收到這兩個時間。
     */

    await setDoc(

      doc(
        db,
        "flowers",
        id
      ),

      {

        cooldownStart:
          start,

        cooldownUntil:
          until,

        updatedAt:
          Date.now(),

        updatedBy:
          auth.currentUser
            ?.email ||
          ""

      },

      {
        merge:true
      }

    );


    /*
     * Firestore 寫入成功。
     *
     * 先不要刪 pending，
     * 等 onSnapshot 收到相同資料後再刪。
     */

    setSyncStatus(
      "☁️ 花田資料已同步"
    );


    updateRefreshTime();


  }catch(error){

    console.error(
      "開始倒數失敗:",
      error
    );


    /*
     * 寫入失敗時才恢復原本狀態。
     */

    pendingCooldowns.delete(
      id
    );


    flower.cooldownStart =
      null;

    flower.cooldownUntil =
      null;


    renderCards();


    setSyncStatus(
      "⚠️ 更新失敗",
      true
    );


    showFirebaseError(
      "倒數更新失敗。請確認你已登入管理員帳號，以及 Firestore Rules 是否允許寫入。"
    );

  }

}


/* =========================================================
   取消倒數
   ========================================================= */

async function clearCooldown(
  id
){

  if(!isAdmin){

    return;

  }


  const flower =
    flowers.find(
      x =>
        x.id === id
    );


  if(!flower){

    return;

  }


  /*
   * 先立即清除本機畫面
   */

  flower.cooldownStart =
    null;

  flower.cooldownUntil =
    null;

  pendingCooldowns.delete(
    id
  );


  renderCards();


  try{

    setSyncStatus(
      "☁️ 正在取消倒數…"
    );


    await setDoc(

      doc(
        db,
        "flowers",
        id
      ),

      {

        cooldownStart:
          null,

        cooldownUntil:
          null,

        updatedAt:
          Date.now(),

        updatedBy:
          auth.currentUser
            ?.email ||
          ""

      },

      {
        merge:true
      }

    );


    setSyncStatus(
      "☁️ 花田資料已同步"
    );


    updateRefreshTime();


  }catch(error){

    console.error(
      "取消倒數失敗:",
      error
    );


    setSyncStatus(
      "⚠️ 更新失敗",
      true
    );


    showFirebaseError(
      "取消倒數失敗，請確認 Firestore Rules。"
    );

  }

}

                data-action="start"
                data-id="${flower.id}"
                data-min="${preset.minutes}"
                type="button"
              >
                ⏳ ${preset.label}
              </button>

            `
          )
          .join("")

        +

        `

          <button
            class="cd-btn reset"
            data-action="clear"
            data-id="${flower.id}"
            type="button"
          >
            ❄️ 取消倒數
          </button>

        `;


      const controlsHtml =
        isAdmin

          ? `

              <div class="cooldown-btns">

                ${cooldownBtns}

              </div>

            `

          : `

              <div class="locked-hint">

                🔒 僅管理員可操作倒數，
                訪客只能查看狀態

              </div>

            `;


      const regionInfo =
        REGIONS[flower.region] ||
        {
          bg:"#3E9166"
        };


      card.innerHTML = `

        <div class="card-top">

          <div class="card-loc">

            📍 ${flower.name}

          </div>

          <span
            class="color-badge"
            style="background:${regionInfo.bg}"
          >

            ${flower.region}

          </span>

        </div>


        <div
          class="status-row loading"
          data-status-for="${flower.id}"
        >

          <span class="status-dot"></span>

          <span class="status-text">
            載入中…
          </span>

          <span class="countdown-time"></span>

        </div>


        <div class="coord-box">

          <code>
            ${flower.coord}
          </code>

          <button
            class="copy-btn"
            type="button"
          >
            複製座標
          </button>

        </div>


        <div class="note">

          ${flower.notes
            .map(
              note =>
                `<div>💬 ${note}</div>`
            )
            .join("")}

        </div>


        ${controlsHtml}

      `;


      const copyBtn =
        card.querySelector(
          ".copy-btn"
        );


      copyBtn.addEventListener(
        "click",
        () =>
          copyCoord(
            flower.coord,
            copyBtn
          )
      );


      card
        .querySelectorAll(
          '[data-action="start"]'
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                if(
                  !isAdmin
                ){

                  return;

                }


                /*
                 * 防止連續狂按。
                 */

                button.disabled =
                  true;


                startCooldown(
                  button.dataset.id,
                  Number(
                    button.dataset.min
                  )
                );


                setTimeout(
                  () => {

                    button.disabled =
                      false;

                  },
                  1000
                );

              }
            );

          }
        );


      card
        .querySelectorAll(
          '[data-action="clear"]'
        )
        .forEach(
          button => {

            button.addEventListener(
              "click",
              () => {

                clearCooldown(
                  button.dataset.id
                );

              }
            );

          }
        );


      grid.appendChild(
        card
      );

    }
  );


  updateAllCountdowns();

}


/* =========================================================
   ★★★ 核心：更新倒數畫面 ★★★
   ========================================================= */

function updateAllCountdowns(){

  const now =
    Date.now();


  flowers.forEach(
    flower => {

      const row =
        document.querySelector(
          `[data-status-for="${flower.id}"]`
        );


      const card =
        document.querySelector(
          `[data-card-for="${flower.id}"]`
        );


      if(!row){

        return;

      }


      const textEl =
        row.querySelector(
          ".status-text"
        );


      const timeEl =
        row.querySelector(
          ".countdown-time"
        );


      /*
       * 取得真正的倒數狀態
       */

      const cooldown =
        getEffectiveCooldown(
          flower
        );


      /*
       * 沒有任何倒數
       */

      if(!cooldown){

        row.className =
          "status-row";

        textEl.textContent =
          "空閒待命，可以前往收成";

        timeEl.textContent =
          "";

        if(card){

          card.classList.remove(
            "harvest-glow"
          );

        }

        return;

      }


      const start =
        cooldown.cooldownStart;

      const until =
        cooldown.cooldownUntil;


      /*
       * 如果資料異常
       */

      if(
        !Number.isFinite(start) ||
        !Number.isFinite(until)
      ){

        row.className =
          "status-row loading";

        textEl.textContent =
          "正在同步花田狀態…";

        timeEl.textContent =
          "";

        return;

      }


      /*
       * ★ 完整倒數結束
       */

      if(
        now >= until
      ){

        row.className =
          "status-row";

        textEl.textContent =
          "空閒待命，可以前往收成";

        timeEl.textContent =
          "";

        if(card){

          card.classList.remove(
            "harvest-glow"
          );

        }


        /*
         * 本機倒數完成後清掉 pending。
         *
         * 不自動寫 Firestore，
         * 因為這樣不同裝置不會互相搶寫。
         */

        const pending =
          pendingCooldowns.get(
            flower.id
          );


        if(pending){

          pendingCooldowns.delete(
            flower.id
          );

        }


        return;

      }


      /*
       * ★ 開花後第一小時
       */

      const harvestEndsAt =
        Math.min(
          start +
            HARVEST_WINDOW_MS,

          until
        );


      if(
        now < harvestEndsAt
      ){

        row.className =
          "status-row harvest";

        textEl.textContent =
          "🍒 可取得果實";

        timeEl.textContent =
          formatRemain(
            harvestEndsAt -
            now
          );


        if(card){

          card.classList.add(
            "harvest-glow"
          );

        }


        return;

      }


      /*
       * ★ 第一小時結束
       *
       * 接下來就是冷卻。
       */

      row.className =
        "status-row cooling";

      textEl.textContent =
        "冷卻中，暫無果實";

      timeEl.textContent =
        formatRemain(
          until -
          now
        );


      if(card){

        card.classList.remove(
          "harvest-glow"
        );

      }

    }
  );

}


/* =========================================================
   每秒更新
   ========================================================= */

setInterval(
  () => {

    updateAllCountdowns();

  },
  1000
);


/* =========================================================
   複製座標
   ========================================================= */

function copyCoord(
  text,
  btn
){

  const done =
    () => {

      const original =
        "複製座標";


      btn.textContent =
        "已複製 🌱";


      btn.classList.add(
        "copied"
      );


      setTimeout(
        () => {

          btn.textContent =
            original;

          btn.classList.remove(
            "copied"
          );

        },
        1400
      );

    };


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(text)
      .then(done)
      .catch(
        () =>
          fallbackCopy(
            text,
            done
          )
      );

  }else{

    fallbackCopy(
      text,
      done
    );

  }

}


/* =========================================================
   舊瀏覽器複製
   ========================================================= */

function fallbackCopy(
  text,
  callback
){

  const textarea =
    document.createElement(
      "textarea"
    );


  textarea.value =
    text;


  textarea.style.position =
    "fixed";

  textarea.style.opacity =
    "0";


  document.body.appendChild(
    textarea
  );


  textarea.select();


  try{

    document.execCommand(
      "copy"
    );

  }catch(error){

    console.error(
      error
    );

  }


  document.body.removeChild(
    textarea
  );


  callback();

}


/* =========================================================
   重新整理
   ========================================================= */

document
  .getElementById(
    "refreshBtn"
  )
  .addEventListener(
    "click",
    () => {

      /*
       * ★ 這裡絕對不重新建立倒數。
       *
       * 只是重新畫畫面。
       *
       * 倒數來源仍然是：
       * Firestore + pendingCooldowns
       */

      updateRefreshTime();

      renderCards();

      updateAllCountdowns();

    }
  );

refreshAdminPill();

renderChips();

renderCards();

updateRefreshTime();

listenToFlowers();

</script>
