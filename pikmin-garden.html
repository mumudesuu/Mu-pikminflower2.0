<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皮克敏花田手記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF6E8;
    --cream-deep:#FBE9CC;
    --leaf:#3E9166;
    --leaf-deep:#276148;
    --ink:#2B4636;
    --pink:#FF7FA8;
    --pink-deep:#E85D8D;
    --yellow:#FFC93C;
    --yellow-deep:#D6A014;
    --sky:#5FC1DE;
    --sky-deep:#2E93B2;
    --purple:#B080E0;
    --purple-deep:#8C57C4;
    --white:#FFFFFF;
    --danger:#E85D5D;
    --card-shadow: 0 6px 0 rgba(39,97,72,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(circle at 8% 8%, rgba(255,201,60,0.20) 0%, transparent 30%),
      radial-gradient(circle at 92% 4%, rgba(255,127,168,0.18) 0%, transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(95,193,222,0.14) 0%, transparent 40%),
      var(--cream);
    color:var(--ink);
    font-family:'Nunito', sans-serif;
    min-height:100vh;
    padding:0 0 80px;
  }
  header{
    max-width:1080px; margin:0 auto;
    padding:40px 24px 22px;
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:20px; flex-wrap:wrap;
  }
  .brand-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--leaf-deep); margin:0 0 6px; font-weight:700;
  }
  h1{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:34px;
    margin:0;
    color:var(--ink);
    line-height:1.15;
  }
  h1 span{color:var(--pink-deep);}
  .sub{color:var(--ink); opacity:.72; font-size:14.5px; margin-top:8px; max-width:440px;}

  .head-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    width:42px; height:42px; border-radius:14px;
    background:var(--white); border:2px solid var(--cream-deep);
    box-shadow:var(--card-shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:18px; cursor:pointer;
    transition:transform .1s ease;
  }
  .icon-btn:hover{transform:translateY(-2px);}
  .icon-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(39,97,72,0.14);}
  .sync-pill{
    font-family:'JetBrains Mono',monospace; font-size:11px;
    padding:6px 12px; border-radius:20px;
    display:flex; align-items:center; gap:6px;
  }
  .sync-pill.ok{background:#E4F4EA; color:var(--leaf-deep);}
  .sync-pill.off{background:#FBE9CC; color:var(--yellow-deep);}
  .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}

  main{max-width:1080px; margin:0 auto; padding:10px 24px;}

  .settings-panel{display:none;}

  .add-bar{
    display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap;
  }
  .add-bar input{
    flex:1; min-width:220px;
    background:var(--white);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:14px;
    padding:13px 16px;
    font-family:'Nunito',sans-serif;
    font-size:15px;
    font-weight:700;
    outline:none;
  }
  .add-bar input::placeholder{color:#A9BBAE; font-weight:600;}
  .add-bar input:focus{border-color:var(--leaf);}
  .add-btn{
    background:var(--leaf);
    color:var(--white);
    border:none;
    border-radius:14px;
    padding:0 22px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:15.5px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--leaf-deep);
    transition:transform .08s ease;
  }
  .add-btn:hover{transform:translateY(-1px);}
  .add-btn:active{transform:translateY(4px); box-shadow:0 1px 0 var(--leaf-deep);}

  .settings-panel{
    background:var(--white);
    border:2px solid var(--cream-deep);
    border-radius:18px;
    padding:18px 20px;
    margin-bottom:24px;
    display:none;
    box-shadow:var(--card-shadow);
  }
  .settings-panel.open{display:block;}
  .settings-panel label{
    font-family:'Baloo 2',sans-serif; font-weight:600; font-size:14px; color:var(--ink);
    display:block; margin-bottom:8px;
  }
  .settings-row{display:flex; gap:10px; flex-wrap:wrap;}
  .settings-row input{
    flex:1; min-width:240px;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    border-radius:12px;
    padding:10px 14px;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    color:var(--ink);
    outline:none;
  }
  .settings-row input:focus{border-color:var(--sky);}
  .settings-btn{
    background:var(--ink); color:var(--white); border:none;
    border-radius:12px; padding:0 18px; font-weight:700; font-size:13.5px;
    cursor:pointer; font-family:'Nunito',sans-serif;
  }
  .settings-hint{font-size:12.5px; color:#7E9484; margin-top:10px; line-height:1.6;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:20px;
  }
  .empty{text-align:center; padding:70px 20px; color:#7E9484;}
  .empty .big{font-family:'Baloo 2',sans-serif; font-size:19px; color:var(--ink); margin-bottom:6px;}

  .card{
    background:var(--white);
    border:2px solid var(--cream-deep);
    border-radius:20px;
    padding:20px 20px 18px;
    display:flex; flex-direction:column; gap:16px;
    box-shadow:var(--card-shadow);
    transition:transform .1s ease;
  }
  .card.ready{border-color:var(--pink); box-shadow:0 6px 0 rgba(232,93,141,0.22);}

  .card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .field-name{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px;
    background:transparent; border:none; color:var(--ink); outline:none; width:100%; padding:0;
  }
  .field-meta{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:#9AAB9F; margin-top:4px;}
  .del-btn{
    background:var(--cream); border:none; color:#9AAB9F;
    cursor:pointer; font-size:15px; line-height:1; width:30px; height:30px;
    border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .del-btn:hover{color:var(--danger); background:#FCE4E4;}

  .bloom-track{display:flex; align-items:center; gap:0;}
  .stage{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    flex:1; cursor:pointer; user-select:none; background:none; border:none; color:inherit; font-family:inherit;
  }
  .stage-icon{
    width:38px; height:38px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:var(--cream); font-size:18px;
    border:2px solid var(--cream-deep);
    transition:all .15s ease;
  }
  .stage.on .stage-icon{border-color:transparent;}
  .stage[data-k="harvest"].on .stage-icon{background:var(--yellow); }
  .stage[data-k="fridge"].on .stage-icon{background:var(--sky); }
  .stage[data-k="ready"].on .stage-icon{background:var(--pink); }
  .stage-label{font-size:11px; color:#9AAB9F; text-align:center; font-weight:700;}
  .stage.on .stage-label{color:var(--ink);}
  .vine{height:3px; flex:0.5; background:var(--cream-deep); margin-bottom:22px; border-radius:2px; overflow:hidden;}
  .vine.on{background:var(--leaf);}

  .timer-box{border-top:2px dashed var(--cream-deep); padding-top:14px; display:flex; flex-direction:column; gap:10px;}
  .timer-label{font-size:11.5px; color:#9AAB9F; font-weight:700; letter-spacing:.02em;}
  .preset-row{display:flex; gap:8px;}
  .preset-btn{
    flex:1;
    background:var(--cream);
    border:2px solid var(--cream-deep);
    color:var(--ink);
    border-radius:11px;
    padding:8px 4px;
    font-family:'Baloo 2',sans-serif;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
  }
  .preset-btn:hover{border-color:var(--sky); background:#EAF7FB;}
  .timer-active-row{display:flex; align-items:center; justify-content:space-between;}
  .timer-display{
    font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; color:var(--sky-deep);
  }
  .timer-display.done{color:var(--pink-deep);}
  .ready-pill{
    font-size:11px; font-family:'Baloo 2',sans-serif; font-weight:700;
    background:var(--pink); color:#5A1230;
    padding:4px 10px; border-radius:20px;
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.5;}}
  .clear-btn{
    background:none; border:none; color:#9AAB9F; font-size:12px; font-weight:700; cursor:pointer;
    text-decoration:underline;
  }
  .clear-btn:hover{color:var(--danger);}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--cream);
    padding:11px 20px; border-radius:14px; font-size:13.5px; font-weight:700;
    box-shadow:0 6px 20px rgba(0,0,0,.2);
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
    z-index:50;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  footer{text-align:center; color:#9AAB9F; font-size:12px; padding-top:24px;}
  @media (max-width:560px){
    header{padding:30px 18px 18px;}
    .add-bar input{min-width:0;}
  }
</style>
</head>
<body>

<header>
  <div>
    <p class="brand-eyebrow">花田管理 · 種花紀錄</p>
    <h1>🌸 皮克敏<span>花田</span>手記</h1>
    <p class="sub">已採果、已冰冰箱、待取冰箱一次記錄，資料存在 Google 試算表，隨開隨用、多裝置自動同步。</p>
  </div>
  <div class="head-actions">
    <span class="sync-pill off" id="syncPill"><span class="dot"></span>尚未連接</span>
  </div>
</header>

<main>
  <div class="add-bar">
    <input type="text" id="newFieldName" placeholder="🌼 新花田名稱，例如：後院 A 區" maxlength="24" autocomplete="off">
    <button class="add-btn" id="addBtn">＋ 新增花田</button>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <div class="big">還沒有花田</div>
    <div id="emptyHint">新增第一塊花田，開始記錄採收進度吧。</div>
  </div>
</main>

<footer>🌼 沐光花語｜友田登記 · 皮克敏花田手記</footer>
<div class="toast" id="toast"></div>

<script>
const APIURL_KEY = 'pikmin-api-url';
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbw8nn7gI0n6-w72t4LfKRzOHguOeuaZVqNiKbouJqKbm_3owUNO-ATpdqrd6LNU0pSQ/exec';
const PRESETS = [23, 6, 3];
let apiUrl = DEFAULT_API_URL;
let fields = [];
let pollHandle = null;
let tickHandle = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function setSyncStatus(ok){
  const pill = document.getElementById('syncPill');
  if(ok){
    pill.className = 'sync-pill ok';
    pill.innerHTML = '<span class="dot"></span>已同步';
  }else{
    pill.className = 'sync-pill off';
    pill.innerHTML = '<span class="dot"></span>尚未連接';
  }
}

async function loadApiUrl(){
  try{
    const res = await window.storage.get(APIURL_KEY, true);
    if(res && res.value){
      apiUrl = res.value;
    }
  }catch(e){}
  fetchFields();
  startPolling();
}

function startPolling(){
  if(pollHandle) clearInterval(pollHandle);
  pollHandle = setInterval(fetchFields, 6000);
}

async function fetchFields(){
  if(!apiUrl) return;
  try{
    const res = await fetch(apiUrl + '?t=' + Date.now());
    const data = await res.json();
    if(data.ok){
      fields = data.fields.map(f => ({
        id: f.id,
        name: f.name,
        harvest: f.harvest === true || f.harvest === 'TRUE',
        fridge: f.fridge === true || f.fridge === 'TRUE',
        ready: f.ready === true || f.ready === 'TRUE',
        createdAt: Number(f.createdAt) || Date.now(),
        timerEnd: f.timerEnd ? Number(f.timerEnd) : null,
        timerHours: f.timerHours || null
      })).sort((a,b) => b.createdAt - a.createdAt);
      setSyncStatus(true);
      render();
    }
  }catch(e){
    setSyncStatus(false);
  }
}

async function callApi(payload){
  if(!apiUrl){ toast('請先在設定裡貼上 Web App 網址'); return null; }
  try{
    const res = await fetch(apiUrl, {
      method: 'POST',
      headers: {'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });
    return await res.json();
  }catch(e){
    toast('連線失敗，請檢查網路或網址');
    return null;
  }
}

async function addField(name){
  await callApi({action:'add', name});
  fetchFields();
}
async function deleteField(id){
  fields = fields.filter(f => f.id !== id);
  render();
  await callApi({action:'delete', id});
  fetchFields();
}
async function renameField(id, name){
  await callApi({action:'rename', id, name: name.trim() || '未命名花田'});
}
async function toggleStage(id, key){
  const f = fields.find(x=>x.id===id);
  if(f) f[key] = !f[key];
  render();
  await callApi({action:'toggleStage', id, key});
  fetchFields();
}
async function startTimer(id, hours){
  const f = fields.find(x=>x.id===id);
  if(f){ f.timerEnd = Date.now() + hours*3600000; f.timerHours = hours; }
  render();
  await callApi({action:'startTimer', id, hours});
  fetchFields();
}
async function clearTimer(id){
  const f = fields.find(x=>x.id===id);
  if(f){ f.timerEnd = null; f.timerHours = null; }
  render();
  await callApi({action:'clearTimer', id});
  fetchFields();
}

function formatDate(ts){
  const d = new Date(ts);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function formatCountdown(ms){
  if(ms <= 0) return '00:00:00';
  const totalSec = Math.floor(ms/1000);
  const h = Math.floor(totalSec/3600);
  const m = Math.floor((totalSec%3600)/60);
  const s = totalSec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function cardTemplate(f){
  const hasTimer = !!f.timerEnd;
  const remaining = hasTimer ? f.timerEnd - Date.now() : 0;
  const timerDone = hasTimer && remaining <= 0;

  return `
  <div class="card ${timerDone ? 'ready':''}" data-id="${f.id}">
    <div class="card-head">
      <div style="flex:1; min-width:0;">
        <input class="field-name" value="${escapeHtml(f.name)}" data-role="name" maxlength="24">
        <div class="field-meta">建立於 ${formatDate(f.createdAt)}</div>
      </div>
      <button class="del-btn" data-role="delete" title="刪除花田">🗑</button>
    </div>

    <div class="bloom-track">
      <button class="stage ${f.harvest?'on':''}" data-role="stage" data-key="harvest" type="button">
        <div class="stage-icon">🧺</div>
        <div class="stage-label">已採果</div>
      </button>
      <div class="vine ${f.harvest?'on':''}"></div>
      <button class="stage ${f.fridge?'on':''}" data-role="stage" data-key="fridge" type="button">
        <div class="stage-icon">❄️</div>
        <div class="stage-label">已冰冰箱</div>
      </button>
      <div class="vine ${f.fridge?'on':''}"></div>
      <button class="stage ${f.ready?'on':''}" data-role="stage" data-key="ready" type="button">
        <div class="stage-icon">🍏</div>
        <div class="stage-label">待取冰箱</div>
      </button>
    </div>

    <div class="timer-box">
      ${hasTimer ? `
        <div class="timer-active-row">
          <span class="timer-label">冷藏倒數 · ${f.timerHours}小時</span>
          ${timerDone ? '<span class="ready-pill">可以取出了</span>' : `<button class="clear-btn" data-role="clear-timer">取消</button>`}
        </div>
        <div class="timer-display ${timerDone?'done':''}" data-role="countdown">${formatCountdown(remaining)}</div>
        ${timerDone ? `<button class="clear-btn" data-role="clear-timer">重設</button>` : ''}
      ` : `
        <span class="timer-label">冷藏倒數</span>
        <div class="preset-row">
          ${PRESETS.map(h => `<button class="preset-btn" data-role="start-timer" data-hours="${h}">${h} 小時</button>`).join('')}
        </div>
      `}
    </div>
  </div>`;
}

function renderEmptyNoApi(){
  document.getElementById('grid').innerHTML = '';
  const empty = document.getElementById('emptyState');
  empty.style.display = 'block';
  document.getElementById('emptyHint').textContent = '請先在右上角齒輪設定裡貼上 Web App 網址，即可開始新增花田。';
}

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');
  if(fields.length === 0){
    grid.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('emptyHint').textContent = '新增第一塊花田，開始記錄採收進度吧。';
    return;
  }
  empty.style.display = 'none';
  grid.innerHTML = fields.map(cardTemplate).join('');

  grid.querySelectorAll('[data-role="delete"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      deleteField(e.target.closest('.card').dataset.id);
    });
  });
  grid.querySelectorAll('[data-role="stage"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.currentTarget.closest('.card');
      toggleStage(card.dataset.id, e.currentTarget.dataset.key);
    });
  });
  grid.querySelectorAll('[data-role="name"]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      renameField(e.target.closest('.card').dataset.id, e.target.value);
    });
  });
  grid.querySelectorAll('[data-role="start-timer"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      const card = e.target.closest('.card');
      startTimer(card.dataset.id, Number(e.target.dataset.hours));
    });
  });
  grid.querySelectorAll('[data-role="clear-timer"]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      clearTimer(e.target.closest('.card').dataset.id);
    });
  });
}

function startTicker(){
  if(tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(()=>{
    let needsRender = false;
    document.querySelectorAll('.card').forEach(card=>{
      const f = fields.find(x=>x.id===card.dataset.id);
      if(!f || !f.timerEnd) return;
      const remaining = f.timerEnd - Date.now();
      const disp = card.querySelector('[data-role="countdown"]');
      if(disp){
        disp.textContent = formatCountdown(remaining);
        if(remaining <= 0 && !disp.classList.contains('done')) needsRender = true;
      }
    });
    if(needsRender) render();
  }, 1000);
}

document.getElementById('addBtn').addEventListener('click', ()=>{
  const input = document.getElementById('newFieldName');
  const name = input.value.trim();
  if(!name) return;
  addField(name);
  input.value = '';
});
document.getElementById('newFieldName').addEventListener('keydown', e=>{
  if(e.key === 'Enter') document.getElementById('addBtn').click();
});

loadApiUrl();
startTicker();
</script>
</body>
</html>
